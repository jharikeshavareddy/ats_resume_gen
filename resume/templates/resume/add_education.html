<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Education</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard' %}">ATS Resume Builder</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Add Education</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Degree *</label>
                                <input type="text" name="degree" class="form-control" placeholder="e.g., B.Tech" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Branch/Specialization</label>
                                <input type="text" name="branch" class="form-control" placeholder="e.g., Computer Science & Engineering">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Institution *</label>
                                <input type="text" name="institution" class="form-control" placeholder="e.g., Mahaveer Institute of Science and Technology" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Year *</label>
                                <input type="text" name="year" class="form-control" placeholder="e.g., 2021 -- 2025" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success">Add Education</button>
                                <a href="{% url 'edit_resume' resume.id %}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
