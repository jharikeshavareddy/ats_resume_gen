<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Certification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard' %}">ATS Resume Builder</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="mb-0">Add Certification</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Certification Name *</label>
                                <input type="text" name="name" class="form-control" placeholder="e.g., Introduction to Cybersecurity" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Issuing Organization *</label>
                                <input type="text" name="issuing_organization" class="form-control" placeholder="e.g., Cisco Networking Academy" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Issue Date</label>
                                <input type="text" name="issue_date" class="form-control" placeholder="e.g., Jan 2024">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Credential ID</label>
                                <input type="text" name="credential_id" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Credential URL</label>
                                <input type="url" name="credential_url" class="form-control" placeholder="https://...">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success">Add Certification</button>
                                <a href="{% url 'edit_resume' resume.id %}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
