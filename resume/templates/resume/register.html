<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #2f80ed;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #1c6dd5;
        }

        .login-link {
            margin-top: 15px;
            text-align: center;
        }

        .login-link a {
            color: #2f80ed;
            text-decoration: none;
            font-size: 14px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: red;
            margin-bottom: 10px;
            font-size: 13px;
            list-style-type: none;
            padding-left: 0;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Create Account</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <label>Username</label>
        {{ form.username.errors }}
        {{ form.username }}

        <label>Password</label>
        {{ form.password1.errors }}
        {{ form.password1 }}

        <label>Confirm Password</label>
        {{ form.password2.errors }}
        {{ form.password2 }}

        <button type="submit">Register</button>
    </form>

    <div class="login-link">
        <p>Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>
    </div>
</div>

</body>
</html>
