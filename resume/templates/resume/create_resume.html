<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Resume</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 30px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        h2, h4 {
            margin-bottom: 15px;
            color: #333;
        }
        form div.section {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background-color: #fdfdfd;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        small {
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Resume</h2>
        <form method="POST">
            {% csrf_token %}

            <!-- Personal Details -->
            <div class="section">
                <h4>Personal Details</h4>
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" name="full_name" required>

                <label for="job_title">Job Title</label>
                <input type="text" id="job_title" name="job_title">

                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>

                <label for="mobile">Mobile</label>
                <input type="text" id="mobile" name="mobile">

                <label for="location">Location</label>
                <input type="text" id="location" name="location">

                <label for="linkedin_url">LinkedIn URL</label>
                <input type="url" id="linkedin_url" name="linkedin_url">

                <label for="github_url">GitHub URL</label>
                <input type="url" id="github_url" name="github_url">

                <label for="portfolio_url">Portfolio URL</label>
                <input type="url" id="portfolio_url" name="portfolio_url">

                <label for="objective">Objective</label>
                <textarea id="objective" name="objective" rows="3"></textarea>

                <label for="professional_summary">Professional Summary</label>
                <textarea id="professional_summary" name="professional_summary" rows="4"></textarea>

                <label for="skills">Skills (comma-separated)</label>
                <textarea id="skills" name="skills" rows="2"></textarea>
            </div>

            <!-- Education -->
            <div class="section">
                <h4>Education</h4>
                <label for="degree">Degree</label>
                <input type="text" id="degree" name="degree">

                <label for="branch">Branch</label>
                <input type="text" id="branch" name="branch">

                <label for="institution">Institution</label>
                <input type="text" id="institution" name="institution">

                <label for="year">Year</label>
                <input type="text" id="year" name="year">
            </div>

            <!-- Project -->
            <div class="section">
                <h4>Project</h4>
                <label for="project_title">Title</label>
                <input type="text" id="project_title" name="project_title">

                <label for="project_description">Description (one point per line)</label>
                <textarea id="project_description" name="project_description" rows="3"></textarea>
                <small>* You can add more projects after creating the resume</small>
            </div>


            <!-- Job Description for ATS -->
            <div class="section">
                <h4>Job Description (for ATS Scoring)</h4>
                <label for="jd_job_title">Target Job Title</label>
                <input type="text" id="jd_job_title" name="jd_job_title">

                <label for="job_description">Job Description</label>
                <textarea id="job_description" name="job_description" rows="6"></textarea>
            </div>

            <button type="submit">Save & Preview Resume</button>
        </form>
    </div>
</body>
</html>
